[pytest]
DJANGO_SETTINGS_MODULE=gh_repo_download.settings.test
;addopts = --nomigrations --video retain-on-failure --screenshot only-on-failure --headed --browser chromium
;addopts = --nomigrations --video retain-on-failure --screenshot only-on-failure --headed --browser chromium --slowmo 1000
addopts = --nomigrations --video retain-on-failure --screenshot only-on-failure --browser chromium
; pytest-playwright-asyncio's browser fixtures live on one session-wide event loop,
; so every async test and fixture has to run on that same loop.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
